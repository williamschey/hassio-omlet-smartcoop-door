name: Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: "Install Home Assistant and the SDK"
        run: pip install -r requirements_test.txt
      - name: "Run the tests"
        run: pytest -v
